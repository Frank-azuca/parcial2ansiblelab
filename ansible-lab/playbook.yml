---
- name: Laboratorio de Ansible con contenedores Docker
  hosts: docker
  gather_facts: true
  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Mostrar el nombre del host
      ansible.builtin.debug:
        msg: "Servidor: {{ inventory_hostname }} | Hostname del contenedor: {{ ansible_facts['hostname'] }}"

    - name: Mostrar el sistema operativo
      ansible.builtin.debug:
        msg: "Sistema operativo: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"

    - name: Crear el directorio /tmp/ansible-demo
      ansible.builtin.file:
        path: /tmp/ansible-demo
        state: directory
        mode: "0755"

    - name: Crear el archivo info.txt con el nombre del servidor y el sistema operativo
      ansible.builtin.copy:
        dest: /tmp/ansible-demo/info.txt
        content: |
          Servidor: {{ inventory_hostname }}
          Sistema operativo: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
        mode: "0644"

    - name: Crear los directorios logs, backup y config con un loop
      ansible.builtin.file:
        path: "/tmp/ansible-demo/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - logs
        - backup
        - config

    - name: Mostrar un mensaje solo si el sistema operativo es Ubuntu
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} usa Ubuntu"
      when: ansible_facts['distribution'] == "Ubuntu"
